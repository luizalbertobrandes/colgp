    function formatDate(date) {
        if (!date) return '-';
        return new Date(date).toLocaleDateString('pt-BR');
    }

    function formatDateTime(date) {
        if (!date) return '-';
        return new Date(date).toLocaleString('pt-BR');
    }

    function showToast(message, type = 'success') {
        const colors = { success: 'bg-green-500', error: 'bg-red-500', info: 'bg-blue-500', warning: 'bg-yellow-500' };
        const toast = document.createElement('div');
        toast.className = `toast ${colors[type]} text-white px-6 py-3 rounded-lg shadow-lg mb-2 fade-in`;
        toast.textContent = message;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 3000);
    }

    // =====================================================
    // AUTENTICAÇÃO
    // =====================================================
    async function signUp(email, password, fullName) {
        if (!supabase) throw new Error('Supabase não configurado');
        const { data, error } = await supabase.auth.signUp({
            email,
            password,
            options: { data: { full_name: fullName } }
        });
        if (error) throw error;
        return data;
    }

    async function signIn(email, password) {
        if (!supabase) throw new Error('Supabase não configurado');
        const { data, error } = await supabase.auth.signInWithPassword({ email, password });
        if (error) throw error;
        return data;
    }

    async function signOut() {
        if (!supabase) throw new Error('Supabase não configurado');
        const { error } = await supabase.auth.signOut();
        if (error) throw error;
        state.user = null;
        state.profile = null;
        renderApp();
    }

    async function getProfile() {
        if (!supabase) throw new Error('Supabase não configurado');
        const { data, error } = await supabase.from('profiles').select('*').eq('id', state.user.id).single();

    async function upsertConsolidation(consolidation) {
        if (!supabase) throw new Error('Supabase não configurado');
        const { data, error } = await supabase.from('position_consolidations').upsert(consolidation, { onConflict: 'position_id,category' }).select();

    // =====================================================
    // CRUD: DESCRIÇÃO FINAL

    async function fetchFinalDescription(positionId) {
        if (!supabase) return null;
        const { data, error } = await supabase.from('position_final_descriptions').select('*').eq('position_id', positionId).single();
        if (error && error.code !== 'PGRST116') throw error;
        return data;
    }

    async function upsertFinalDescription(description) {
        if (!supabase) throw new Error('Supabase não configurado');
        const { data, error } = await supabase.from('position_final_descriptions').upsert(description, { onConflict: 'position_id' }).select();
        if (error) throw error;
        return data[0];
    }

    // =====================================================
    // ESTATÍSTICAS
    // =====================================================
    async function fetchStats() {
        if (!supabase) return state.stats;
        const [companies, positions, interviews, questionnaires, observations] = await Promise.all([
            supabase.from('companies').select('id', { count: 'exact', head: true }).eq('user_id', state.user.id),
            supabase.from('positions').select('id', { count: 'exact', head: true }).eq('user_id', state.user.id),
            supabase.from('interviews').select('id', { count: 'exact', head: true }).eq('user_id', state.user.id),
            supabase.from('questionnaires').select('id', { count: 'exact', head: true }).eq('user_id', state.user.id),
            supabase.from('observations').select('id', { count: 'exact', head: true }).eq('user_id', state.user.id)
        ]);
        state.stats = {
            companies: companies.count || 0,
            positions: positions.count || 0,
            interviews: interviews.count || 0,
            questionnaires: questionnaires.count || 0,
            observations: observations.count || 0
        };
        return state.stats;
    }

    function showModal(title, content, onSave) {
        const modal = document.createElement('div');
        modal.className = 'modal-overlay';
        modal.id = 'modal';
        modal.innerHTML = `
            <div class="bg-white rounded-2xl shadow-2xl w-full max-w-2xl max-h-[90vh] overflow-y-auto fade-in">
                <div class="p-6 border-b border-gray-200">
                    <div class="flex justify-between items-center">
                        <h3 class="text-xl font-bold text-gray-800">${title}</h3>
                        <button onclick="closeModal()" class="text-gray-400 hover:text-gray-600">
                            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                            </svg>
                        </button>
                    </div>
                </div>
                <div class="p-6" id="modalContent">
                    ${content}
                </div>
            </div>
        `;
        document.body.appendChild(modal);
    }

    function closeModal() {
        const modal = document.getElementById('modal');
        if (modal) modal.remove();
    }

    function showConfirmModal(message, onConfirm) {
        showModal('Confirmar Exclusão', `
            <p class="text-gray-600 mb-6">${message}</p>
            <div class="flex justify-end gap-3">
                <button onclick="closeModal()" class="px-4 py-2 border border-gray-300 rounded-lg text-gray-700 hover:bg-gray-50">
                    Cancelar
                </button>
                <button onclick="(${onConfirm.toString()})(); closeModal();" 
                    class="px-4 py-2 bg-red-600 text-white rounded-lg hover:bg-red-700">
                    Excluir
                </button>
            </div>
        `);
    }

                    <button type="submit" 
                        class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">
                        ${isEdit ? 'Salvar' : 'Cadastrar'}
                    </button>
                </div>
            </form>
        `);

        document.getElementById('observationForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            const data = Object.fromEntries(formData);
            data.position_id = state.currentPositionId;
            
            try {
                if (isEdit) {
                    await updateObservation(observation.id, data);
                    showToast('Observação atualizada com sucesso!');
                } else {
                    await createObservation(data);
                    showToast('Observação registrada com sucesso!');
                }
                closeModal();
                loadObservations();
            } catch (error) {
                showToast('Erro ao salvar observação: ' + error.message, 'error');
            }
        });
    }

    // =====================================================
    // RENDERIZAÇÃO PRINCIPAL
    // =====================================================
    
    function renderApp(initialPage = null) {
        const app = document.getElementById('app');
        
        // Verificar se o Supabase está configurado
        if (!isConfigured) {
            app.innerHTML = renderConfig();
            return;
        }
        
        if (initialPage) {
            state.currentPage = initialPage;
        }
        
        if (state.currentPage === 'login') {
            app.innerHTML = renderLogin();
            setupLoginForm();
        } else if (state.currentPage === 'register') {
            app.innerHTML = renderRegister();
            setupRegisterForm();
        } else {
            switch (state.currentPage) {
                case 'dashboard':
                    app.innerHTML = renderDashboard();
                    loadCompanies();
                    fetchStats().then(stats => {
                        document.getElementById('stat-companies').textContent = stats.companies;
                        document.getElementById('stat-positions').textContent = stats.positions;
                        document.getElementById('stat-interviews').textContent = stats.interviews;
                        document.getElementById('stat-questionnaires').textContent = stats.questionnaires;
                        document.getElementById('stat-observations').textContent = stats.observations;
                    });
                    break;
                case 'companies':
                    app.innerHTML = renderCompanies();
                    loadCompanies();
                    break;
                case 'positions':
                    app.innerHTML = renderPositions();
                    loadPositions();
                    break;
                case 'position':
                    app.innerHTML = renderPosition();
                    loadPositionData();
                    break;
                default:
                    app.innerHTML = renderDashboard();
                    loadCompanies();
            }
        }
    }

    async function loadPositionData() {
        try {
            const position = await getPosition(state.currentPositionId);
            document.getElementById('positionName').textContent = position.name;
            document.getElementById('positionInfo').textContent = `${position.companies?.name || ''} | ${position.sector || ''} | ${position.department || ''}`;
            
            await updateProgress();
            renderPositionContent();
        } catch (error) {
            showToast('Erro ao carregar cargo: ' + error.message, 'error');
        }
    }

    async function updateProgress() {
        try {
            const [interviews, questionnaires, observations] = await Promise.all([
                fetchInterviews(state.currentPositionId),
                fetchQuestionnaires(state.currentPositionId),
                fetchObservations(state.currentPositionId)
            ]);
            
            const checks = [
                { label: 'Entrevista', done: interviews.length > 0 },
                { label: 'Questionário', done: questionnaires.length > 0 },
                { label: 'Observação', done: observations.length > 0 }
            ];
            
            const completed = checks.filter(c => c.done).length;
            const percent = Math.round((completed / 3) * 100);
            
            document.getElementById('progressPercent').textContent = `${percent}%`;
            document.getElementById('progressBar').style.width = `${percent}%`;
            document.getElementById('progressChecks').innerHTML = checks.map(check => `
                <div class="flex items-center gap-2">
                    <div class="w-5 h-5 rounded-full ${check.done ? 'bg-green-500' : 'bg-gray-300'} flex items-center justify-center">
                        ${check.done ? '<svg class="w-3 h-3 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>' : ''}
                    </div>
                    <span class="text-sm ${check.done ? 'text-green-600 font-medium' : 'text-gray-500'}">${check.label}</span>
                </div>
            `).join('');
        } catch (error) {
            console.error('Erro ao atualizar progresso:', error);
        }
    }

    function renderPositionContent() {
        const container = document.getElementById('tabContent');
        
        switch (state.currentTab) {
            case 'overview':
                loadPositionOverview(container);
                break;
            case 'interviews':
                container.innerHTML = '<div id="interviewsContent"></div>';
                loadInterviews();
                break;
            case 'questionnaires':
                container.innerHTML = '<div id="questionnairesContent"></div>';
                loadQuestionnaires();
                break;
            case 'observations':
                container.innerHTML = '<div id="observationsContent"></div>';
                loadObservations();
                break;
            case 'consolidation':
                loadConsolidation(container);
                break;
            case 'finalDescription':
                loadFinalDescription(container);
                break;
        }
    }

    async function saveConsolidations() {
        const categories = document.querySelectorAll('[data-category]');
        const saved = new Set();
        
        try {
            for (const el of categories) {
                const category = el.dataset.category;
                if (saved.has(category)) continue;
                
                const container = el.closest('.border');
                const consolidation = {
                    position_id: state.currentPositionId,
                    user_id: state.user.id,
                    category: category,
                    interview_data: container.querySelector('.consolidation-interview')?.value || '',
                    questionnaire_data: container.querySelector('.consolidation-questionnaire')?.value || '',
                    observation_data: container.querySelector('.consolidation-observation')?.value || '',
                    conclusion: container.querySelector('.consolidation-conclusion')?.value || ''
                };
                
                await upsertConsolidation(consolidation);
                saved.add(category);
            }
            
            showToast('Consolidação salva com sucesso!');
        } catch (error) {
            showToast('Erro ao salvar consolidação: ' + error.message, 'error');
        }
    }

    // =====================================================

    function setupLoginForm() {
        document.getElementById('loginForm')?.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            
            try {
                await signIn(email, password);
                showToast('Login realizado com sucesso!');
                navigateTo('dashboard');
            } catch (error) {
                showToast('Erro ao fazer login: ' + error.message, 'error');
            }
        });
    }

    function setupRegisterForm() {
        document.getElementById('registerForm')?.addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('registerName').value;
            const email = document.getElementById('registerEmail').value;
            const password = document.getElementById('registerPassword').value;
            const confirmPassword = document.getElementById('registerConfirmPassword').value;
            
            if (password !== confirmPassword) {
                showToast('As senhas não conferem!', 'error');
                return;
            }
            
            try {
                await signUp(email, password, name);
                showToast('Conta criada com sucesso! Verifique seu e-mail.');
                navigateTo('login');
            } catch (error) {
                showToast('Erro ao criar conta: ' + error.message, 'error');
            }
        });
    }

    // =====================================================
    // INICIALIZAÇÃO
    // =====================================================
    
    document.addEventListener('DOMContentLoaded', async () => {
        // Se o Supabase não está configurado, mostrar tela de config
        if (!isConfigured) {
            renderApp();
            return;
        }
        
        try {
            const { data: { session } } = await supabase.auth.getSession();
            
            if (session) {
                state.user = session.user;
                try {
                    state.profile = await getProfile();
                    navigateTo('dashboard');
                } catch (error) {
                    console.error('Erro ao carregar perfil:', error);
                    navigateTo('login');
                }
            } else {
                navigateTo('login');
            }
            
            supabase.auth.onAuthStateChange(async (event, session) => {
                if (event === 'SIGNED_IN' && session) {
                    state.user = session.user;
                    state.profile = await getProfile();
                    navigateTo('dashboard');
                } else if (event === 'SIGNED_OUT') {
                    state.user = null;
                    state.profile = null;
                    navigateTo('login');
                }
            });
        } catch (error) {
            console.error('Erro ao inicializar:', error);
            navigateTo('login');
        }
    });

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Análise de Cargos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-50">
    <div id="app"></div>

    <script>
    // Configuração
    const SUPABASE_URL = 'https://yunbinnbusouyeemxrmh.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_NOMC2Bpp8J8V1W65pvI8Hw_d4Re-YHg';
    
    const isConfigured = SUPABASE_URL !== 'SUA_URL_SUPABASE' && SUPABASE_ANON_KEY !== 'SUA_ANON_KEY_SUPABASE';
    let supabase = null;
    
    if (isConfigured) {
        try {
            supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        } catch (e) {
            console.error('Erro ao inicializar Supabase:', e);
        }
    }

    // Estado
    let state = {
        user: null,
        currentPage: 'config'
    };

    // Tela de Configuração
    function renderConfig() {
        return `
        <div class="min-h-screen bg-gradient-to-br from-yellow-500 to-orange-600 flex items-center justify-center p-4">
            <div class="bg-white rounded-2xl shadow-2xl p-8 w-full max-w-lg">
                <div class="text-center mb-8">
                    <h1 class="text-2xl font-bold text-gray-800">Análise de Cargos</h1>
                    <p class="text-gray-500 mt-2">Plataforma Educacional</p>
                </div>
                
                <div class="bg-yellow-50 border border-yellow-200 rounded-lg p-4 mb-6">
                    <h3 class="font-semibold text-yellow-800 mb-2">Configure o Supabase:</h3>
                    <ol class="list-decimal list-inside text-sm text-yellow-700 space-y-2">
                        <li>Acesse <a href="https://supabase.com" target="_blank" class="underline font-bold">supabase.com</a></li>
                        <li>Crie uma conta gratuita</li>
                        <li>Crie um novo projeto</li>
                        <li>Vá em <strong>SQL Editor</strong> e execute o script SQL</li>
                        <li>Vá em <strong>Settings &gt; API</strong></li>
                        <li>Copie a <strong>URL</strong> e a <strong>anon key</strong></li>
                        <li>Atualize o arquivo <code class="bg-yellow-100 px-1 rounded">index.html</code></li>
                    </ol>
                </div>
                
                <div class="bg-blue-50 border border-blue-200 rounded-lg p-4">
                    <h3 class="font-semibold text-blue-800 mb-2">Exemplo:</h3>
                    <pre class="text-xs text-blue-700 bg-blue-100 p-2 rounded">const SUPABASE_URL = 'https://xxx.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOi...';</pre>
                </div>
            </div>
        </div>`;
    }

    // Tela de Login
    function renderLogin() {
        return `
        <div class="min-h-screen bg-gradient-to-br from-blue-600 to-blue-800 flex items-center justify-center p-4">
            <div class="bg-white rounded-2xl shadow-2xl p-8 w-full max-w-md">
                <div class="text-center mb-8">
                    <h1 class="text-2xl font-bold text-gray-800">Análise de Cargos</h1>
                    <p class="text-gray-500 mt-2">Faça login para continuar</p>
                </div>
                
                <form id="loginForm" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">E-mail</label>
                        <input type="email" id="loginEmail" required
                            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500"
                            placeholder="seu@email.com">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Senha</label>
                        <input type="password" id="loginPassword" required
                            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500"
                            placeholder="••••••••">
                    </div>
                    <button type="submit" 
                        class="w-full bg-blue-600 text-white py-3 rounded-lg font-semibold hover:bg-blue-700">
                        Entrar
                    </button>
                </form>
            </div>
        </div>`;
    }

    // Dashboard
    function renderDashboard() {
        return `
        <div class="min-h-screen bg-gray-50">
            <nav class="bg-white shadow-sm">
                <div class="max-w-7xl mx-auto px-4 py-4">
                    <div class="flex justify-between items-center">
                        <h1 class="text-xl font-bold text-gray-800">Análise de Cargos</h1>
                        <button onclick="signOut()" class="text-gray-500 hover:text-gray-700">Sair</button>
                    </div>
                </div>
            </nav>
            
            <main class="max-w-7xl mx-auto px-4 py-8">
                <h2 class="text-2xl font-bold text-gray-800 mb-6">Painel</h2>
                
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                    <div class="bg-white rounded-xl shadow-sm p-6">
                        <p class="text-gray-500">Empresas</p>
                        <p class="text-3xl font-bold text-gray-800">0</p>
                    </div>
                    <div class="bg-white rounded-xl shadow-sm p-6">
                        <p class="text-gray-500">Cargos</p>
                        <p class="text-3xl font-bold text-gray-800">0</p>
                    </div>
                    <div class="bg-white rounded-xl shadow-sm p-6">
                        <p class="text-gray-500">Análises</p>
                        <p class="text-3xl font-bold text-gray-800">0</p>
                    </div>
                </div>
                
                <div class="bg-white rounded-xl shadow-sm p-6">
                    <h3 class="text-lg font-semibold mb-4">Suas Empresas</h3>
                    <p class="text-gray-500">Nenhuma empresa cadastrada ainda.</p>
                </div>
            </main>
        </div>`;
    }

    // Renderizar
    function renderApp() {
        const app = document.getElementById('app');
        
        if (!isConfigured) {
            app.innerHTML = renderConfig();
        } else if (!state.user) {
            app.innerHTML = renderLogin();
            setupLoginForm();
        } else {
            app.innerHTML = renderDashboard();
        }
    }

    // Setup Login
    function setupLoginForm() {
        document.getElementById('loginForm')?.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            
            try {
                const { data, error } = await supabase.auth.signInWithPassword({ email, password });
                if (error) throw error;
                state.user = data.user;
                renderApp();
            } catch (error) {
                alert('Erro ao fazer login: ' + error.message);
            }
        });
    }

    // Logout
    async function signOut() {
        await supabase.auth.signOut();
        state.user = null;
        renderApp();
    }

    // Iniciar
    document.addEventListener('DOMContentLoaded', () => {
        console.log('App iniciado');
        console.log('Supabase configurado:', isConfigured);
        renderApp();
    });
    </script>
</body>
</html>
